<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Label Resizer</title>
<style>
body{font-family:Arial;max-width:700px;margin:40px auto}
label{display:block;margin-top:12px}
button{margin-top:20px;padding:10px 20px}
</style>
</head>
<body>
<h2>PDF Label Resizer</h2>
<form action="/convert" method="POST" enctype="multipart/form-data">
<label>PDF</label>
<input type="file" name="pdf" required>

<label>Lebar (mm)</label>
<input type="number" step="0.1" name="width" value="100">

<label>Tinggi (mm)</label>
<input type="number" step="0.1" name="height" value="100">

<label>Mode</label>
<select name="mode">
<option value="fit">Fit</option>
<option value="fill">Fill</option>
<option value="custom">Custom Scale</option>
</select>

<label>Custom Scale (%)</label>
<input type="number" name="custom_scale" value="100">

<button type="submit">Convert PDF</button>
</form>
</body>
</html>
